name: Deploy Web to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create missing asset folders
        run: |
          mkdir -p assets/animations assets/images

      - name: Inject service account (assets)
        run: echo "${{ secrets.SERVICE_ACCOUNT_BASE64 }}" | base64 --decode > assets/service_account.json

      - name: Inject Gemini API Key
        run: |
          python3 - << 'PYEOF'
          import os, re
          api_key = os.environ.get('GEMINI_API_KEY', '').replace('\n', '').replace('\r', '').strip()
          with open('lib/services/gemini_service.dart', 'r', encoding='utf-8') as f:
              content = f.read()
          # Remplace toute la déclaration const _apiKey = String.fromEnvironment(...)
          pattern = r"static const _apiKey\s*=\s*String\.fromEnvironment\([^)]+\)\s*,?\s*\n?\s*defaultValue:\s*''\)?\s*;"
          replacement = "static const _apiKey = '" + api_key + "';"
          new_content, count = re.subn(pattern, replacement, content)
          if count == 0:
              # Fallback : remplace toute ligne contenant _apiKey = avec fromEnvironment
              lines = new_content.split('\n')
              for i, line in enumerate(lines):
                  if '_apiKey' in line and 'fromEnvironment' in line:
                      lines[i] = "  static const _apiKey = '" + api_key + "';"
                      count = 1
                  elif '_apiKey' in line and "defaultValue:" in line:
                      lines[i] = ''
                      count = 1
              new_content = '\n'.join(lines)
          with open('lib/services/gemini_service.dart', 'w', encoding='utf-8') as f:
              f.write(new_content)
          print(f"Gemini key injected ({count} remplacement(s))")
          PYEOF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build Web
        run: flutter build web --release --no-tree-shake-icons

      - name: Add unique build identifier (force new Firebase version)
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_HASH=${{ github.sha }}
          # Add unique comment to index.html to change file hash
          sed -i "s|</body>|<!-- build: $TIMESTAMP commit: $COMMIT_HASH --></body>|" build/web/index.html
          # Also add build_info.json
          echo "{\"timestamp\":\"$TIMESTAMP\",\"commit\":\"$COMMIT_HASH\"}" > build/web/build_info.json

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Decode service account
        run: echo "${{ secrets.SERVICE_ACCOUNT_BASE64 }}" | base64 --decode > /tmp/sa.json

      - name: Deploy Firestore Rules
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only firestore:rules --project sks-familly-3f205 --non-interactive || true

      - name: Deploy to Firebase Hosting
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only hosting --project sks-familly-3f205 --non-interactive || true
