name: Deploy Web to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: sks-familly-3f205
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create missing asset folders
        run: |
          mkdir -p assets/animations assets/images

      - name: Build Web
        # Le cache Flutter historique bloque parfois les gestes dans la PWA iOS.
        # FCM conserve son propre service worker à portée séparée.
        run: flutter build web --release --no-tree-shake-icons --pwa-strategy=none

      - name: Add unique build identifier (force new Firebase version)
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_HASH=${{ github.sha }}
          # Add unique comment to index.html to change file hash
          sed -i "s|</body>|<!-- build: $TIMESTAMP commit: $COMMIT_HASH --></body>|" build/web/index.html
          # Also add build_info.json
          echo "{\"timestamp\":\"$TIMESTAMP\",\"commit\":\"$COMMIT_HASH\"}" > build/web/build_info.json

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project sks-familly-3f205 --non-interactive
