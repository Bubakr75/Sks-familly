name: Build Flutter APK and Play bundle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/feature/family-security-maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Guard manual test build
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/family-security-maintenance"
          test "$GITHUB_REF_NAME" != "main"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

      - name: Decode Google services configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Configure signing
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=release\n'
            printf 'storeFile=../release-key.jks\n'
          } > android/key.properties

      - name: Create missing asset folders
        run: mkdir -p assets/animations assets/images

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Test Play bundle checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_play_bundle.py'
          python3 -m unittest discover -s scripts -p 'test_android_notification_manifest.py'

      - name: Run Cloud Functions tests
        run: cd functions && npm ci && npm test

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Verify Android release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/proguard-rules.pro
          test -f android/app/google-services.json
          test -f android/key.properties
          test -f android/release-key.jks
          if find assets -type f -name 'service_account.json' -print -quit | grep -q .; then
            echo "A service account file is present in assets."
            exit 1
          fi

      - name: Resolve and validate app version
        id: app_version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_FULL=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)
          if ! [[ "$VERSION_FULL" =~ ^([^+]+)\+([0-9]+)$ ]]; then
            echo "Version pubspec.yaml illisible. Format attendu: x.y.z+build."
            exit 1
          fi
          VERSION_NAME="${BASH_REMATCH[1]}"
          VERSION_CODE="${BASH_REMATCH[2]}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION_FULL"
          fi
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [[ "$LATEST_TAG" =~ \+([0-9]+)$ ]]; then
            LATEST_CODE="${BASH_REMATCH[1]}"
          elif [[ "$LATEST_TAG" =~ -build([0-9]+)$ ]]; then
            LATEST_CODE="${BASH_REMATCH[1]}"
          else
            echo "VersionCode officiel illisible."
            exit 1
          fi
          if [ "$VERSION_CODE" -le "$LATEST_CODE" ]; then
            echo "Le versionCode doit être supérieur à la version officielle $LATEST_CODE."
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons \
            --build-name="${{ steps.app_version.outputs.name }}" \
            --build-number="${{ steps.app_version.outputs.code }}" \
            2>&1 | tee build-release.log

      - name: Upload private APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKS-Family-test-${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          if unzip -Z1 "$APK" | grep -Eqi '(^|/)(service_account\.json|key\.properties|[^/]*\.(jks|keystore))$'; then
            echo "A forbidden sensitive file is present in the APK."
            exit 1
          fi

      - name: Verify application ID and official signing certificate
        id: official_signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)
          test -n "$AAPT"
          test -n "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK")
          grep -q "package: name='com.bubakr.sks_family'" <<< "$BADGING"
          grep -q "versionCode='${{ steps.app_version.outputs.code }}'" <<< "$BADGING"
          grep -q "versionName='${{ steps.app_version.outputs.name }}'" <<< "$BADGING"
          PERMISSIONS=$("$AAPT" dump permissions "$APK")
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' <<< "$PERMISSIONS"; then
            echo "Permission REQUEST_INSTALL_PACKAGES interdite."
            exit 1
          fi

          mkdir -p /tmp/official-apk
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir /tmp/official-apk
          OFFICIAL_APK=$(find /tmp/official-apk -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$OFFICIAL_APK"

          source scripts/extract_apk_cert_sha256.sh

          read_apk_cert_sha256() {
            local apk_path="$1"
            local apk_label="$2"
            local apksigner_output

            if ! apksigner_output=$("$APKSIGNER" verify --print-certs "$apk_path" 2>&1); then
              echo "Erreur: apksigner n'a pas pu vérifier ${apk_label}." >&2
              return 1
            fi

            if ! extract_apk_cert_sha256 "$apksigner_output"; then
              echo "Erreur: impossible d'extraire une empreinte SHA-256 valide pour ${apk_label}." >&2
              return 1
            fi
          }

          TEST_CERT=$(read_apk_cert_sha256 "$APK" "l'APK de test")
          OFFICIAL_CERT=$(read_apk_cert_sha256 "$OFFICIAL_APK" "l'APK officiel")
          echo "Certificat APK test SHA-256: $TEST_CERT"
          echo "Certificat APK officiel SHA-256: $OFFICIAL_CERT"
          if [ "$TEST_CERT" != "$OFFICIAL_CERT" ]; then
            echo "Le certificat de signature diffère de l'APK officiel."
            exit 1
          fi
          echo "sha256=$OFFICIAL_CERT" >> "$GITHUB_OUTPUT"

      - name: Build Release App Bundle
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release --no-tree-shake-icons \
            --build-name="${{ steps.app_version.outputs.name }}" \
            --build-number="${{ steps.app_version.outputs.code }}"

      - name: Download pinned bundletool
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundletool"
          gh release download 1.18.3 --repo google/bundletool \
            --pattern 'bundletool-all-1.18.3.jar' --dir "$RUNNER_TEMP/bundletool"

      - name: Verify actual Play bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_play_bundle.py \
            --bundle build/app/outputs/bundle/release/app-release.aab \
            --bundletool "$RUNNER_TEMP/bundletool/bundletool-all-1.18.3.jar" \
            --version-name "${{ steps.app_version.outputs.name }}" \
            --version-code "${{ steps.app_version.outputs.code }}" \
            --expected-cert "${{ steps.official_signing.outputs.sha256 }}" \
            --report build/play-bundle-report.json

      - name: Upload validated Play bundle artifact
        if: github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: SKS-Family-Play-${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/play-bundle-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Explain private bundle retention requirement
        if: github.event.repository.private != true
        run: |
          echo 'AAB vérifié mais non téléversé : un dépôt privé est requis pour sa conservation confidentielle.'

      - name: Prepare test APK name
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/SKS-Family-test-${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk"

      - name: Create GitHub Prerelease test
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-v${{ steps.app_version.outputs.name }}+${{ steps.app_version.outputs.code }}
          name: "Test Android v${{ steps.app_version.outputs.name }}+${{ steps.app_version.outputs.code }}"
          body: "Prerelease de test de la branche feature/family-security-maintenance."
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/SKS-Family-test-${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare stable APK name
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/SKS-Family-${{ steps.app_version.outputs.name }}-build${{ steps.app_version.outputs.code }}.apk"

      - name: Create stable GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.name }}+${{ steps.app_version.outputs.code }}
          name: "SKS Family ${{ steps.app_version.outputs.name }} — build ${{ steps.app_version.outputs.code }}"
          body: |
            - Accès directs aux bonus, pénalités et lignes depuis l’accueil et la navigation.
            - Profils enfants plus lisibles ; checklist conservée dans les outils secondaires.
            - Formulaires plus robustes : erreurs réseau expliquées, saisie conservée et doubles clics bloqués.
            - Correction de l’aperçu des pénalités pour les soldes supérieurs à 999 points.
            - Assistant familial harmonisé avec Emerald et respectant le verrou parental.
            - Configuration corrigée pour les notifications locales de fin de chrono.
            - Cache des photos borné et fermeture plus propre des écrans.
            - Même identifiant et certificat Android que les versions officielles précédentes.
          files: build/app/outputs/flutter-apk/SKS-Family-${{ steps.app_version.outputs.name }}-build${{ steps.app_version.outputs.code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
