name: Build Flutter APK v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

      - name: Decode Google services configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Configure signing
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=release\n'
            printf 'storeFile=../release-key.jks\n'
          } > android/key.properties

      - name: Inject Gemini API Key
        run: |
          python3 - << 'PYEOF'
          import os
          api_key = os.environ.get('GEMINI_API_KEY', '').replace('\n', '').replace('\r', '').strip()
          with open('lib/services/gemini_service.dart', 'r', encoding='utf-8') as f:
              lines = f.readlines()
          new_lines = []
          skip_next = False
          for i, line in enumerate(lines):
              if skip_next:
                  skip_next = False
                  continue
              # Ne remplacer QUE la déclaration : static const _apiKey =
              if 'static const _apiKey' in line and '=' in line:
                  new_lines.append("  static const _apiKey = '" + api_key + "';\n")
                  # Si la ligne suivante contient defaultValue, la sauter
                  if i + 1 < len(lines) and 'defaultValue' in lines[i + 1]:
                      skip_next = True
              else:
                  new_lines.append(line)
          with open('lib/services/gemini_service.dart', 'w', encoding='utf-8') as f:
              f.writelines(new_lines)
          print("Gemini key injected OK")
          PYEOF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create missing asset folders
        run: mkdir -p assets/animations assets/images

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Verify Android release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/proguard-rules.pro
          test -f android/app/google-services.json
          test -f android/key.properties
          test -f android/release-key.jks
          if find assets -type f -name 'service_account.json' -print -quit | grep -q .; then
            echo "A service account file is present in assets."
            exit 1
          fi

      - name: Resolve app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          if [ -z "$VERSION_NAME" ]; then
            echo "Version introuvable dans pubspec.yaml"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Version résolue : $VERSION_NAME+${{ github.run_number }}"

      - name: Build Release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons \
            --build-name="${{ steps.app_version.outputs.name }}" \
            --build-number="${{ github.run_number }}" \
            2>&1 | tee build-release.log

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          if unzip -Z1 "$APK" | grep -Eq '(^|/)(service_account\.json|release-key\.jks|key\.properties)$'; then
            echo "A forbidden sensitive file is present in the APK."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.name }}+${{ github.run_number }}
          name: "Family Score v${{ steps.app_version.outputs.name }}+${{ github.run_number }}"
          body: "Build #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
