name: Build Flutter APK v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/feature/family-security-maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Guard manual test build
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/family-security-maintenance"
          test "$GITHUB_REF_NAME" != "main"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

      - name: Decode Google services configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Configure signing
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=release\n'
            printf 'storeFile=../release-key.jks\n'
          } > android/key.properties

      - name: Inject Gemini API Key
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os
          api_key = os.environ.get('GEMINI_API_KEY', '').replace('\n', '').replace('\r', '').strip()
          with open('lib/services/gemini_service.dart', 'r', encoding='utf-8') as f:
              lines = f.readlines()
          new_lines = []
          skip_next = False
          for i, line in enumerate(lines):
              if skip_next:
                  skip_next = False
                  continue
              if 'static const _apiKey' in line and '=' in line:
                  new_lines.append("  static const _apiKey = '" + api_key + "';\n")
                  if i + 1 < len(lines) and 'defaultValue' in lines[i + 1]:
                      skip_next = True
              else:
                  new_lines.append(line)
          with open('lib/services/gemini_service.dart', 'w', encoding='utf-8') as f:
              f.writelines(new_lines)
          print("Gemini key injected")
          PYEOF

      - name: Create missing asset folders
        run: mkdir -p assets/animations assets/images

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Verify Android release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/proguard-rules.pro
          test -f android/app/google-services.json
          test -f android/key.properties
          test -f android/release-key.jks
          if find assets -type f -name 'service_account.json' -print -quit | grep -q .; then
            echo "A service account file is present in assets."
            exit 1
          fi

      - name: Resolve and validate app version
        id: app_version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          test -n "$VERSION_NAME"
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          LATEST_CODE=${LATEST_TAG##*+}
          if ! [[ "$LATEST_CODE" =~ ^[0-9]+$ ]]; then
            echo "VersionCode officiel illisible."
            exit 1
          fi
          if [ "${{ github.run_number }}" -le "$LATEST_CODE" ]; then
            echo "Le versionCode doit être supérieur à la version officielle $LATEST_CODE."
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons \
            --build-name="${{ steps.app_version.outputs.name }}" \
            --build-number="${{ steps.app_version.outputs.code }}" \
            2>&1 | tee build-release.log

      - name: Upload private APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKS-Family-test-${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          if unzip -Z1 "$APK" | grep -Eqi '(^|/)(service_account\.json|key\.properties|[^/]*\.(jks|keystore))$'; then
            echo "A forbidden sensitive file is present in the APK."
            exit 1
          fi

      - name: Verify application ID and official signing certificate
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.bubakr.sks_family'"

          mkdir -p /tmp/official-apk
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir /tmp/official-apk
          OFFICIAL_APK=$(find /tmp/official-apk -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$OFFICIAL_APK"

          source scripts/extract_apk_cert_sha256.sh

          read_apk_cert_sha256() {
            local apk_path="$1"
            local apk_label="$2"
            local apksigner_output

            if ! apksigner_output=$("$APKSIGNER" verify --print-certs "$apk_path" 2>&1); then
              echo "Erreur: apksigner n'a pas pu vérifier ${apk_label}." >&2
              return 1
            fi

            if ! extract_apk_cert_sha256 "$apksigner_output"; then
              echo "Erreur: impossible d'extraire une empreinte SHA-256 valide pour ${apk_label}." >&2
              return 1
            fi
          }

          TEST_CERT=$(read_apk_cert_sha256 "$APK" "l'APK de test")
          OFFICIAL_CERT=$(read_apk_cert_sha256 "$OFFICIAL_APK" "l'APK officiel")
          echo "Certificat APK test SHA-256: $TEST_CERT"
          echo "Certificat APK officiel SHA-256: $OFFICIAL_CERT"
          if [ "$TEST_CERT" != "$OFFICIAL_CERT" ]; then
            echo "Le certificat de signature diffère de l'APK officiel."
            exit 1
          fi

      - name: Prepare test APK name
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/SKS-Family-test-${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk"

      - name: Create GitHub Prerelease test
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-v${{ steps.app_version.outputs.name }}+${{ steps.app_version.outputs.code }}
          name: "Test Android v${{ steps.app_version.outputs.name }}+${{ steps.app_version.outputs.code }}"
          body: "Prerelease de test de la branche feature/family-security-maintenance."
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/SKS-Family-test-${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stable GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.name }}+${{ steps.app_version.outputs.code }}
          name: "Family Score v${{ steps.app_version.outputs.name }}+${{ steps.app_version.outputs.code }}"
          body: "Build #${{ steps.app_version.outputs.code }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
