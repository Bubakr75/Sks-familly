<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SKS Family - Application familiale de points et rÃ©compenses">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SKS Family</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fond NOIR PUR pour que la vidÃ©o d'intro dÃ©marre sans logo ni Ã©cran gris */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Splash de chargement : NOIR PUR, sans logo, pour transition invisible vers la vidÃ©o */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #FFFFFF;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
      margin-top: 26px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* BanniÃ¨re d'installation iOS */
    #ios-install-banner {
      position: fixed;
      left: 12px; right: 12px;
      bottom: 12px;
      z-index: 100;
      background: linear-gradient(135deg, #00E676, #047857);
      color: #051410;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    #ios-install-banner.show { display: flex; }
    #ios-install-banner .emoji { font-size: 22px; }
    #ios-install-banner .close {
      margin-left: auto;
      background: rgba(5,20,16,0.18);
      border: none;
      color: #051410;
      font-size: 18px;
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <div id="intro-overlay" style="position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;">
    <video id="intro-video" src="videos/intro.mp4" autoplay muted playsinline style="width:100%;height:100%;object-fit:contain;"></video>
    <button id="intro-skip" style="position:absolute;top:40px;right:20px;background:rgba(0,0,0,0.5);color:#fff;border:none;padding:10px 20px;border-radius:20px;font-size:15px;cursor:pointer;">Passer</button>
    <button id="intro-sound" style="position:absolute;bottom:40px;right:20px;background:rgba(0,0,0,0.5);color:#fff;border:none;padding:10px 20px;border-radius:20px;font-size:15px;cursor:pointer;">Activer le son</button>
  </div>
  <script>
    (function(){
      var ov = document.getElementById('intro-overlay');
      var vid = document.getElementById('intro-video');
      var skip = document.getElementById('intro-skip');
      var snd = document.getElementById('intro-sound');
      function hide(){ if(ov){ setTimeout(function(){ ov.style.transition='opacity 0.8s'; ov.style.opacity='0'; setTimeout(function(){ if(ov) ov.remove(); },850); }, 600); } }
      if(vid){ vid.onended = hide; }
      if(skip){ skip.onclick = hide; }
      if(snd){ snd.onclick = function(){ if(vid){ vid.muted=false; vid.play(); snd.style.display='none'; } }; }
      setTimeout(hide, 20000);
    })();
  </script>
  <!-- Splash : fond NOIR PUR (zÃ©ro logo, pour transition invisible vers la vidÃ©o d'intro) -->
  <div id="loading"></div>

  <!-- BanniÃ¨re "Ajouter Ã  l'Ã©cran d'accueil" pour iOS -->
  <div id="ios-install-banner">
    <span class="emoji">ðŸ“²</span>
    <span>Pour les notifications sur iPhone, ajoutez SKS Ã  l'Ã©cran d'accueil : <b>Partager</b> <span style="font-size:16px">âŽ‹</span> puis <b>Sur l'Ã©cran d'accueil</b></span>
    <button class="close" id="ios-banner-close">âœ•</button>
  </div>

  <!-- Flutter (bootstrap gÃ¨re le chargement de l'app) -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // ============================================================
    // 1. ENREGISTREMENT DU SERVICE WORKER (firebase-messaging-sw.js)
    //    Fait AVANT l'init Firebase cÃ´tÃ© Dart => notifs web fiabilisÃ©es
    // ============================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js')
          .then(function (reg) {
            console.log('[SW] Service worker enregistrÃ© :', reg.scope);
          })
          .catch(function (err) {
            console.warn('[SW] Ã‰chec enregistrement service worker :', err);
          });
      });
    }

    // ============================================================
    // 2. MASQUER LE SPLASH de faÃ§on robuste
    //    On attend l'apparition du <flutter-view> dans le DOM (polling
    //    lÃ©ger). DÃ¨s qu'il existe, on masque le splash. Garde-fou 10s.
    // ============================================================
    (function () {
      var loading = document.getElementById('loading');
      var hidden = false;
      function hideLoading() {
        if (hidden || !loading) return;
        hidden = true;
        loading.classList.add('hidden');
        setTimeout(function () {
          if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
        }, 600);
      }

      // a) DÃ¨s que le flutter-view est prÃ©sent => on masque
      function checkFlutterView() {
        var fv = document.querySelector('flutter-view');
        if (fv || document.querySelector('flt-glass-pane')) {
          // petit dÃ©lai pour laisser Flutter peindre sa 1re frame
          setTimeout(hideLoading, 300);
        } else {
          setTimeout(checkFlutterView, 250);
        }
      }
      window.addEventListener('load', function () { checkFlutterView(); });

      // b) Ã‰vÃ©nement officiel Flutter (si dispo)
      window.addEventListener('flutter-first-frame', hideLoading);

      // c) Garde-fou absolu : masque aprÃ¨s 10s quoi qu'il arrive
      setTimeout(hideLoading, 10000);
    })();

    // ============================================================
    // 3. PROMPT PWA + DÃ‰TECTION iOS
    // ============================================================
    (function () {
      function isStandalone() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
            || window.navigator.standalone === true;
      }
      function isIOS() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent)
            && !/crios|fxios/i.test(navigator.userAgent);
      }

      if (isIOS() && !isStandalone()) {
        try {
          if (sessionStorage.getItem('sks_ios_banner_dismissed') !== '1') {
            window.addEventListener('load', function () {
              setTimeout(function () {
                var b = document.getElementById('ios-install-banner');
                if (b) b.classList.add('show');
              }, 3000);
            });
          }
        } catch (e) {}

        var btn = document.getElementById('ios-banner-close');
        if (btn) {
          btn.addEventListener('click', function () {
            try { sessionStorage.setItem('sks_ios_banner_dismissed', '1'); } catch (e) {}
            var b = document.getElementById('ios-install-banner');
            if (b) b.classList.remove('show');
          });
        }
      }

      var deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
      });
    })();
  </script>
</body>
</html>
