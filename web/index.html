<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SKS Family - Application familiale de points et récompenses">
  <meta name="application-name" content="SKS Family">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SKS Family">
  <meta name="theme-color" content="#051410">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png?v=3">
  <link rel="manifest" href="manifest.json?v=3">
  <title>SKS Family</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #000;
      opacity: 1;
      pointer-events: none;
      transition: opacity 160ms ease-out;
    }
    #loading.hidden { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      #loading { transition: none; }
    }
    #ios-install-banner, #pwa-install-banner {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 100;
      display: none;
      align-items: center;
      gap: 12px;
      border-radius: 16px;
      padding: 14px 16px;
      color: #051410;
      background: linear-gradient(135deg, #00E676, #D4AF37);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
      font-size: 13px;
      font-weight: 700;
    }
    #ios-install-banner.show, #pwa-install-banner.show { display: flex; }
    #ios-install-banner button, #pwa-install-banner button {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: #047857;
      font-weight: 800;
      cursor: pointer;
    }
    #ios-install-banner .close, #pwa-install-close {
      margin-left: auto;
      color: #051410;
      background: transparent;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="loading" aria-hidden="true"></div>

  <aside id="ios-install-banner" role="status" aria-label="Installer SKS Family sur iPhone">
    <span aria-hidden="true">📲</span>
    <span>Dans Safari, touchez Partager, puis « Sur l’écran d’accueil ».</span>
    <button class="close" id="ios-banner-close" type="button" aria-label="Fermer la proposition d’installation">✕</button>
  </aside>

  <aside id="pwa-install-banner" role="status" aria-label="Installer SKS Family">
    <span aria-hidden="true">📲</span>
    <span>Installez SKS Family pour l’ouvrir comme une application.</span>
    <button id="pwa-install-button" type="button">Installer</button>
    <button id="pwa-install-close" type="button" aria-label="Fermer la proposition d’installation">✕</button>
  </aside>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      'use strict';

      var loading = document.getElementById('loading');
      var loadingRemoved = false;
      function removeLoading() {
        if (loadingRemoved) return;
        loadingRemoved = true;
        if (!loading) return;
        loading.classList.add('hidden');
        window.setTimeout(function () {
          if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
          loading = null;
        }, 180);
      }
      window.addEventListener('flutter-first-frame', removeLoading, { once: true });
      var flutterObserver = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          removeLoading();
          flutterObserver.disconnect();
        }
      });
      flutterObserver.observe(document.documentElement, { childList: true, subtree: true });
      window.setTimeout(function () {
        removeLoading();
        flutterObserver.disconnect();
      }, 12000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register(
            'firebase-messaging-sw.js',
            { scope: '/firebase-cloud-messaging-push-scope' }
          ).catch(function () {});
        }, { once: true });
      }

      function isStandalone() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true;
      }
      function isIOS() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent);
      }

      // iOS conserve parfois l'ancien cache Flutter de l'icône d'accueil
      // alors que Safari charge déjà la nouvelle version. Le service worker
      // FCM reste séparé et n'est jamais supprimé ici.
      if (isIOS() && isStandalone() && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            if (!registration.scope.includes('/firebase-cloud-messaging-push-scope')) {
              registration.unregister().catch(function () {});
            }
          });
        }).catch(function () {});
      }
      function hideBanner(id, storageKey) {
        try { sessionStorage.setItem(storageKey, '1'); } catch (_) {}
        var banner = document.getElementById(id);
        if (banner) banner.classList.remove('show');
      }

      if (isIOS() && !isStandalone()) {
        try {
          if (sessionStorage.getItem('sks_ios_banner_dismissed') !== '1') {
            window.setTimeout(function () {
              var banner = document.getElementById('ios-install-banner');
              if (banner) banner.classList.add('show');
            }, 3000);
          }
        } catch (_) {}
      }
      var iosClose = document.getElementById('ios-banner-close');
      if (iosClose) iosClose.addEventListener('click', function () {
        hideBanner('ios-install-banner', 'sks_ios_banner_dismissed');
      });

      var deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        var banner = document.getElementById('pwa-install-banner');
        if (banner && !isStandalone()) banner.classList.add('show');
      });
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        hideBanner('pwa-install-banner', 'sks_pwa_banner_dismissed');
      });
      var installButton = document.getElementById('pwa-install-button');
      if (installButton) installButton.addEventListener('click', async function () {
        if (!deferredPrompt || installButton.disabled) return;
        installButton.disabled = true;
        try {
          await deferredPrompt.prompt();
          await deferredPrompt.userChoice;
        } catch (_) {
          // Le navigateur peut refuser l'invite sans bloquer l'interface.
        } finally {
          deferredPrompt = null;
          installButton.disabled = false;
          hideBanner('pwa-install-banner', 'sks_pwa_banner_dismissed');
        }
      });
      var installClose = document.getElementById('pwa-install-close');
      if (installClose) installClose.addEventListener('click', function () {
        hideBanner('pwa-install-banner', 'sks_pwa_banner_dismissed');
      });
    })();
  </script>
</body>
</html>
